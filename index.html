<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Fora de Foco</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #d9ead0; }
      * { -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; }
      #unity-container { position: fixed; inset: 0; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #d9ead0; }
      #unity-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        font-family: sans-serif; color: #5a4632; font-size: 5vmin; }
      /* portrait warning (mobile) */
      #orient { position: fixed; inset: 0; display: none; z-index: 10; background: #d9ead0;
        align-items: center; justify-content: center; text-align: center;
        font-family: sans-serif; color: #5a4632; font-size: 6vmin; padding: 8vmin; }
      @media (orientation: portrait) and (pointer: coarse) {
        #unity-container { visibility: hidden; }
        #orient { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="unity-loading">A carregar…</div>
    <div id="orient">📱➡️🔄<br/>Por favor, rode o dispositivo para a horizontal.</div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingEl = document.querySelector("#unity-loading");

      function resize() {
        // match the canvas drawing buffer to the window for crisp rendering
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
      }
      window.addEventListener("resize", resize);
      window.addEventListener("orientationchange", resize);
      resize();

      // Try to force landscape on phones: fullscreen + orientation lock on the
      // first touch (Android Chrome supports it; iOS Safari ignores -> overlay).
      function forceLandscape() {
        var el = document.documentElement;
        var rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
        var done = function () {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch(function () {});
          }
        };
        if (rfs) {
          var p = rfs.call(el);
          if (p && p.then) p.then(done).catch(function () {}); else done();
        } else { done(); }
      }
      window.addEventListener("touchend", function once() {
        forceLandscape();
        window.removeEventListener("touchend", once);
      }, { passive: true });

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/WebBuild.data.unityweb",
        frameworkUrl: buildUrl + "/WebBuild.framework.js.unityweb",
        codeUrl: buildUrl + "/WebBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Fora de Foco",
        productVersion: "1.0",
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/WebBuild.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          loadingEl.textContent = "A carregar… " + Math.round(p * 100) + "%";
        }).then(function () {
          loadingEl.style.display = "none";
        }).catch(function (e) {
          loadingEl.textContent = "Erro ao carregar: " + e;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
